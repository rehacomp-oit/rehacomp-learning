# All configuration for plugins and other utils is defined here.
# Read more about `setup.cfg`:
# https://docs.python.org/3/distutils/configfile.html


[flake8]
# Reporting:
count = True
statistics = True
show-source = True

# Setup flake8-import-order:
import-order-style = google

# Setup flake8-quotes:
docstring-quotes = '
avoid-escape = False

# Other options:
# Final bracket should match indentation of the start of the line of the opening bracket
hang-closing = False
max-annotations-complexity = 4
max-complexity = 10
max-expression-complexity = 6
ignore-django-orm-queries-complexity = true
max-line-length = 120
use_class_attributes_order_strict_mod = True

ignore =
  # Missing whitespace around parameter equals:
  E252,
  # Too many blank lines
  E303,
  # Multiple statements on one line (colon)
  E701,
  # Do not assign a lambda expression
  E731,

per-file-ignores =
  __init__.py:F401,
  apps.py:F401
  models.py: F401, F403

exclude =
  .*,
  __pycache__,
  LICENSE,
  *.code-workspace,
  *.sql,
  *.sqlite,
  *.db,
  *.json,
  *.md


[mypy]
enable_error_code =
  truthy-bool,
  truthy-iterable,
  redundant-expr,
  unused-awaitable,
  ignore-without-code,
  possibly-undefined,
  redundant-self,
  explicit-override,
  mutable-override,
  unimported-reveal,
  deprecated,

explicit_package_bases = true
ignore_missing_imports = true
local_partial_types = true
strict = true
strict_bytes = true
warn_unreachable = true

plugins =
  mypy_django_plugin.main,
  returns.contrib.mypy.returns_plugin


[mypy-server.apps.*.migrations.*]
# Django migrations should not produce any errors (they are tested anyway):
ignore_errors = true


[mypy.plugins.django-stubs]
# Docs: https://github.com/typeddjango/django-stubs
django_settings_module = server.settings
strict_settings = false


[tool:pytest]
# pytest-django configuration:
# https://pytest-django.readthedocs.io/en/latest/
DJANGO_SETTINGS_MODULE = server.settings

# Timeout for tests, so they can not take longer
timeout = 5

# Strict `@xfail` by default:
xfail_strict = true

# Directories that are not visited by pytest collector:
norecursedirs = pgdata *.egg .eggs dist build docs .tox .git __pycache__

markers =
  module: mark a test as a module test.
  integration: mark a test as a integration test.

addopts =
  --strict-markers
  --strict-config
  --doctest-modules
  --fail-on-template-vars
  # Output:
  --tb=short
  -p no:warnings
