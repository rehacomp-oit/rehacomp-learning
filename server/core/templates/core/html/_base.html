{% load django_htmx %}
{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <title>{% block subtitle %}{% endblock subtitle %} - обучение</title>

  <!-- Setup htmx configuration -->
  <meta name="htmx-config" content='{
    "historyCacheSize": 15,
    "selfRequestsOnly": true,
    "includeIndicatorStyles": false
  }'>

  <script src="{% static 'core/js/htmx.min.js' %}" defer></script>
</head>



<body>
  <header class="header" role="banner">
    <p>Будущая Шапка</p>
  </header>
  <br>

  <div class="application-screan"> {% block content %}{% endblock %} </div>
  <br>
</body>


</html>
