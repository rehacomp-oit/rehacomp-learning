{% extends base_template %}
{% block subtitle %}Вход{% endblock subtitle %}


{% block content %}
  <main hx-boost="true" hx-target=".application-screan">


    <h1>Вход в систему</h1>
    <p>если ещё нет аккаунта, самое время
      <br>
      <a href="{% url 'accounts:register' %}">зарегистрироваться</a></p>

    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}

      <div class="fieldWrapper">
        {{ form.username.as_field_group }}
      </div>
      <div class="fieldWrapper">
        {{ form.password.as_field_group }}
      </div>

      <button type="submit">Войти</button>
    </form>


  </main>
{% endblock %}
